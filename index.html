<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#12141a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Haul Empire — tap to drive, build a fleet, and conquer the open road. A trucking idle game.">
<title>Haul Empire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ffb020'/><text x='50' y='68' font-size='58' text-anchor='middle'>🚚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#12141a;--panel:#181b23;--card:#21252f;--card2:#2a2f3b;--line:#323849;--txt:#eef1f7;--mut:#98a1b3;--acc:#ffb020;--acc2:#ff7a1a;--good:#4ade80;--bad:#f87171;--blue:#60a5fa;--n:0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0c10;color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.bungee{font-family:Bungee,Impact,system-ui,sans-serif;letter-spacing:.5px}
#app{width:100%;max-width:520px;height:100vh;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden;background:var(--bg);box-shadow:0 0 40px #000}

/* header */
#top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 8px) 14px 8px;background:linear-gradient(#1b1f29,#151820);border-bottom:1px solid var(--line);z-index:5}
#cash{font-size:28px;color:var(--good);line-height:1.05;text-shadow:0 2px 0 #0006}
#rate{font-size:13px;color:var(--mut);margin-top:2px}
#rate b{color:var(--txt)}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--acc);white-space:nowrap}
#shareTag{color:var(--blue)}

/* scene */
#scene{position:relative;height:36vh;min-height:210px;max-height:330px;overflow:hidden;touch-action:manipulation;cursor:pointer;
  background:linear-gradient(to bottom,var(--s0,#5ab8ff) 0%,var(--s1,#bfe6ff) 56%,var(--gr,#5aa04c) 56%);transition:background .6s,height .25s}
.layer{position:absolute;left:0;right:0;background-repeat:repeat-x;background-size:auto 100%;pointer-events:none}
#far{bottom:42%;height:40%}
#mid{bottom:36%;height:36%}
#near{bottom:36%;height:20%;z-index:2}
#road{position:absolute;left:0;right:0;bottom:0;height:37%;background:var(--road,#3a3d45);z-index:1;box-shadow:inset 0 3px 0 #0003}
#road:before,#road:after{content:"";position:absolute;left:0;right:0;height:3px;background:#ffffff55}
#road:before{top:6%}#road:after{bottom:6%}
#dash{position:absolute;left:0;right:0;top:44%;height:4px;background:repeating-linear-gradient(90deg,var(--line2,#ffd34d) 0 34px,transparent 34px 78px)}
#sun{position:absolute;width:44px;height:44px;border-radius:50%;background:radial-gradient(#fff7c2,#ffd34d 60%,#ffb02000 72%);box-shadow:0 0 40px #ffd34d88;pointer-events:none}
#planet{position:absolute;top:9%;right:14%;width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#9fd6ff,#2a6fd6 45%,#1d4f2f 70%,#0b1d3a);box-shadow:0 0 24px #4aa3ff66;display:none;pointer-events:none}
#stars{position:absolute;inset:0 0 40% 0;opacity:0;pointer-events:none;background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 80px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 150px 20px,#fff,transparent),radial-gradient(1px 1px at 210px 90px,#fff,transparent),radial-gradient(1px 1px at 260px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 330px 75px,#fff,transparent);background-size:360px 120px}
#night{position:absolute;inset:0;background:#0a1030;opacity:0;pointer-events:none;z-index:3}
#traffic{position:absolute;inset:0;z-index:2;pointer-events:none}
.car{position:absolute;bottom:20%;height:13%;transform:scaleX(-1)}
.car svg{height:100%;width:auto;display:block}
#truckWrap{position:absolute;bottom:4%;right:20%;height:33%;z-index:4;pointer-events:none;filter:brightness(calc(1 - var(--n)*.3)) drop-shadow(0 4px 2px #0005)}
#truck{height:100%;animation:bob .5s ease-in-out infinite alternate}
#truck svg{height:100%;width:auto;display:block;overflow:visible}
@keyframes bob{to{transform:translateY(-1.5px)}}
.wh{animation:spin var(--ws,.4s) linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.beam{opacity:var(--n)}
#fx{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.float{position:absolute;font-weight:800;font-size:17px;color:#fff;text-shadow:0 2px 0 #000a,0 0 8px #000;white-space:nowrap;animation:floatUp .9s ease-out forwards;transform:translate(-50%,-50%)}
.float.sm{font-size:12px;opacity:.85;color:#d9ffe6}
.float.big{font-size:22px;color:var(--acc)}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-220%) scale(1)}}
.puff{position:absolute;width:12px;height:12px;border-radius:50%;background:#cfd3da;opacity:.8;animation:puff .8s ease-out forwards}
@keyframes puff{to{transform:translate(-30px,-26px) scale(2.6);opacity:0}}
.conf{position:absolute;width:7px;height:10px;border-radius:2px;animation:conf 1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
#banner{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%) scale(0);z-index:7;text-align:center;pointer-events:none;opacity:0}
#banner.show{animation:pop 1.3s ease-out forwards}
#banner .t{font-family:Bungee,Impact,sans-serif;font-size:26px;color:var(--acc);text-shadow:0 3px 0 #000,0 0 18px #000a;white-space:nowrap}
#banner .s{font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 0 #000}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%) scale(1)}}
#hint{position:absolute;left:50%;top:22%;transform:translateX(-50%);z-index:7;font-family:Bungee,Impact,sans-serif;font-size:18px;color:#fff;text-shadow:0 2px 0 #000,0 0 12px #000;pointer-events:none;animation:pulse 1s ease-in-out infinite alternate;white-space:nowrap}
@keyframes pulse{to{transform:translateX(-50%) scale(1.12)}}
#boosts{position:absolute;top:8px;left:8px;z-index:7;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip{font-size:12px;font-weight:800;padding:4px 8px;border-radius:99px;background:#000a;color:#fff;border:1px solid #ffffff33}
.chip.tail{color:#7dd3fc}.chip.nitro{color:#fca5a5}
.gold{position:absolute;z-index:8;font-size:38px;line-height:1;cursor:pointer;animation:gbob .7s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ffd34d) drop-shadow(0 0 4px #fff);padding:10px;touch-action:manipulation}
.gold:after{content:"RUSH!";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font:800 10px system-ui;color:#000;background:var(--acc);border-radius:4px;padding:1px 4px}
@keyframes gbob{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}
.gold.out{animation:gout .35s forwards}
@keyframes gout{to{transform:scale(1.8);opacity:0}}

/* delivery */
#delivery{padding:8px 14px 9px;background:var(--panel);border-bottom:1px solid var(--line)}
.drow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.drow.small{font-size:12px;color:var(--mut);font-weight:600;margin-top:6px}
#dPay{color:var(--good)}
.bar{height:12px;background:#0d0f14;border-radius:99px;overflow:hidden;margin-top:5px;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:99px;transition:width .08s}
.cbar{height:4px;background:#0d0f14;border-radius:99px;overflow:hidden;margin-top:4px}
.cbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#60a5fa,#c084fc,#f472b6)}
#combo.hot{color:#f472b6}

/* panel */
#panel{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 16px;overscroll-behavior:contain}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.card .ic{width:44px;height:44px;flex:none;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-size:24px}
.card .info{flex:1;min-width:0}
.nm{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.own{display:inline-block;min-width:22px;text-align:center;font-size:12px;background:var(--acc);color:#1a1200;border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.sub{font-size:12px;color:var(--mut);margin-top:2px}
.sub b{color:var(--good);font-weight:700}
.ms{height:4px;background:#0d0f14;border-radius:99px;margin-top:6px;overflow:hidden}
.ms i{display:block;height:100%;background:var(--blue);width:0}
.buy{flex:none;min-width:88px;padding:8px 10px;border-radius:12px;background:#3a3f4d;color:#aab;display:flex;flex-direction:column;align-items:center;line-height:1.15;transition:transform .08s,background .15s}
.buy small{font-size:11px;opacity:.8}
.buy b{font-size:14px}
.buy.ok{background:linear-gradient(#ffc23d,#ff9a1a);color:#2a1700;box-shadow:0 3px 0 #b85f00}
.buy.ok:active{transform:translateY(2px);box-shadow:0 1px 0 #b85f00}
.buy.done{background:#1f3b2a;color:var(--good)}
.card.mystery{opacity:.55;border-style:dashed}
.card.mystery .ic{filter:grayscale(1) brightness(.4)}
.buybar{display:flex;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--mut);font-weight:700}
.buybar span{margin-right:4px}
.seg{flex:1;padding:7px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.seg.on{background:var(--acc);color:#2a1700;border-color:var(--acc)}
.sect{font-size:12px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:1px;margin:14px 4px 8px}
.empty{text-align:center;color:var(--mut);padding:26px 16px;font-size:14px}
.route.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.route.locked{opacity:.5}
.ipo{background:linear-gradient(135deg,#1e2a44,#2a1e44);border:1px solid #3d4a77;border-radius:16px;padding:14px;margin-bottom:10px}
.ipo h3{margin:0 0 4px;font-family:Bungee,Impact,sans-serif;font-weight:400;font-size:18px;color:#93c5fd}
.ipo p{margin:4px 0;font-size:13px;color:#c7cfe0}
.ipo .big{font-size:22px;font-weight:800;color:#fff}
.btn{display:block;width:100%;padding:12px;border-radius:12px;font-weight:800;font-size:15px;background:#3a3f4d;color:#99a;margin-top:10px}
.btn.ok{background:linear-gradient(#7cb8ff,#3b82f6);color:#fff;box-shadow:0 3px 0 #1d4ed8}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:#3b1d22;color:#fca5a5;border:1px solid #5c2a31}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.ach{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:11px;color:var(--mut)}
.ach .ai{font-size:22px;filter:grayscale(1) opacity(.35)}
.ach.got{color:var(--txt);border-color:#6b5a1e;background:#2a2516}
.ach.got .ai{filter:none}
.ach b{display:block;font-size:11px;margin-top:2px}
.stats{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 12px}
.stats div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.stats div:last-child{border:0}
.stats span{color:var(--mut)}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}

/* tabs */
#tabs{display:flex;background:#151820;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;font-weight:700;color:var(--mut);position:relative}
#tabs button .ti{font-size:21px;filter:grayscale(.8);transition:transform .15s}
#tabs button.on{color:var(--acc)}
#tabs button.on .ti{filter:none;transform:translateY(-2px) scale(1.1)}
#tabs button.on:before{content:"";position:absolute;top:0;left:25%;right:25%;height:3px;border-radius:0 0 3px 3px;background:var(--acc)}
.dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:#ef4444;box-shadow:0 0 0 2px #151820;display:none}
.dot.show{display:block;animation:dotp 1s infinite alternate}
@keyframes dotp{to{transform:scale(1.25)}}

/* toasts & modal */
#toasts{position:absolute;left:0;right:0;bottom:7px;z-index:9;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 12px}
.toast{background:#0c0e13ee;border:1px solid var(--line);border-left:4px solid var(--acc);padding:7px 12px;border-radius:11px;font-size:12px;font-weight:700;box-shadow:0 8px 24px #0008;animation:tin .25s ease-out,tout .3s ease-in 2.1s forwards;max-width:100%}
.toast.ach{border-left-color:#facc15}.toast.blue{border-left-color:var(--blue)}.toast.gt{border-left-color:#ffd34d;background:#2a2108ee}
@keyframes tin{from{transform:translateY(12px);opacity:0}}
@keyframes tout{to{transform:translateY(12px);opacity:0}}
#modal{position:absolute;inset:0;background:#000b;z-index:30;display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;text-align:center;animation:tin .25s}
.mbox h2{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:4px 0 8px;color:var(--acc);font-size:22px}
.mbox p{color:#c7cfe0;font-size:14px;margin:8px 0}
.mbox .em{font-size:44px}
.mbox .money{font-size:26px;font-weight:800;color:var(--good)}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.best{display:inline-block;font-size:10px;font-weight:800;background:var(--good);color:#06240f;border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.best[hidden]{display:none}
.card.isbest{border-color:#2f6b45}
.subnav{display:flex;gap:6px;margin:-10px -10px 10px;position:sticky;top:-10px;z-index:3;background:var(--bg);padding:10px 10px 6px}
.tog{flex:none;min-width:64px;padding:9px 10px;border-radius:10px;font-weight:800;font-size:12px;background:#3a3f4d;color:#aab}
.tog.on{background:var(--good);color:#06240f}
.prog{height:6px;background:#0d0f14;border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#34d399,#4ade80)}
.cl{color:var(--mut);font-size:11px;margin-top:3px}
.lv{font-size:11px;color:#c4b5fd;font-weight:800;margin-left:5px}
.divbar{display:flex;justify-content:space-between;align-items:center;background:#231d3d;border:1px solid #3f3470;border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:800}
.divbar b{color:#c4b5fd;font-size:17px}
textarea.code{width:100%;height:110px;background:#0d0f14;color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:11px ui-monospace,monospace;resize:none;-webkit-user-select:text;user-select:text;word-break:break-all}
#planet.gas{background:radial-gradient(circle at 35% 35%,#ffe0b0,#d9925a 45%,#8a4a2a 75%,#2a1208);box-shadow:0 0 24px #ffb06044}
#planet.gas:after{content:"";position:absolute;left:-35%;right:-35%;top:40%;height:20%;border-radius:50%;border:2px solid #f5d0a0aa;transform:rotate(-14deg)}
.flame{animation:fl .12s infinite alternate;transform-box:fill-box;transform-origin:right center}
@keyframes fl{to{transform:scaleX(.65)}}
.ring{animation:rp 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
.r2{animation-delay:-.6s}
@keyframes rp{to{opacity:.15;transform:scale(1.06)}}
#tabs button{font-size:10.5px}
#app.mapmode #scene{height:22vh;min-height:150px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -10px 8px;padding:0 10px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:none;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:12px;white-space:nowrap}
.chip2.on{background:var(--acc);color:#2a1700;border-color:var(--acc)}
.chip2.lock{border-style:dashed;color:var(--mut)}
.netstat{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.netstat.mini{padding:7px 10px}
.nsrow{display:flex;justify-content:space-between;font-size:12px;font-weight:800}
.nbar{height:6px;background:#0d0f14;border-radius:99px;overflow:hidden;margin-top:5px}
.nbar i{display:block;height:100%;width:0;background:#4ade80;transition:width .3s,background .3s}
.nhint{font-size:11.5px;color:var(--mut);margin-top:5px;font-weight:600}
.mapwrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0b0d14;touch-action:manipulation}
svg.map{display:block;width:100%;height:auto}
svg.map text.cn{paint-order:stroke;stroke:#0b0d14;stroke-width:.7px;pointer-events:none}
svg.map text{pointer-events:none;font-family:system-ui,-apple-system,sans-serif}
.zap{animation:zp .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
@keyframes zp{to{transform:scale(1.35)}}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-top:8px;min-height:92px}
.sh-t{font-weight:800;font-size:16px}
.sh-s{font-size:12px;color:var(--acc);font-weight:800}
.sh-p{font-size:12.5px;color:var(--mut);margin:6px 0 2px;line-height:1.4}
.sh-p b{color:var(--txt)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}
.kv span{color:var(--mut)}.kv b{text-align:right}.kv b.g{color:var(--good)}
.buy.wide{width:100%;flex-direction:row;justify-content:space-between;padding:10px 12px;margin-top:6px}
.buy.wide small{font-size:12px;opacity:1;font-weight:700}
.tip{display:block;width:100%;text-align:left;margin-top:8px;padding:9px 11px;border-radius:11px;background:#1d2a20;border:1px solid #2f6b45;font-size:12.5px;line-height:1.35}
.tip span{display:block;color:var(--good);font-size:11.5px;font-weight:700;margin-top:2px}
.zapb{font-size:11px;background:var(--acc);color:#2a1700;border-radius:6px;padding:1px 5px;vertical-align:2px}
.legend{display:flex;gap:12px;justify-content:center;margin:8px 0 2px;font-size:11px;color:var(--mut);font-weight:700}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:4px;vertical-align:2px}
.legend i.dash{background:repeating-linear-gradient(90deg,#aab3c5 0 4px,transparent 4px 7px)}
@media (min-width:521px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
@media (max-height:640px){#scene{height:32vh;min-height:180px}#cash{font-size:24px}}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div><div id="cash" class="bungee">$0</div><div id="rate"><b>$0</b> /sec</div></div>
    <div class="hright"><div class="tag" id="routeTag">📍 Local Runs</div><div class="tag" id="shareTag" hidden>📈 0 shares</div></div>
  </header>
  <div id="scene">
    <div id="stars"></div><div id="sun"></div><div id="planet"></div>
    <div class="layer" id="far"></div><div class="layer" id="mid"></div><div class="layer" id="near"></div>
    <div id="road"><div id="dash"></div></div>
    <div id="traffic"></div>
    <div id="night"></div>
    <div id="truckWrap"><div id="truck"></div></div>
